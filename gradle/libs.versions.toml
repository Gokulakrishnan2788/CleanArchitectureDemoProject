[versions]

# --------------------------------------------------
# Android Gradle Plugin
# --------------------------------------------------
agp = "8.13.0"

# --------------------------------------------------
# Kotlin
# --------------------------------------------------
kotlin = "2.1.0"
jetbrainsKotlinJvm = "2.1.0"

# --------------------------------------------------
# Android Core Libraries
# --------------------------------------------------
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"

# --------------------------------------------------
# Testing
# --------------------------------------------------
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

# --------------------------------------------------
# Lifecycle
# --------------------------------------------------
lifecycleRuntimeKtx = "2.8.7"
lifecycleRuntimeCompose = "2.8.7"
lifecycleViewModelCompose = "2.8.7"

# --------------------------------------------------
# Jetpack Compose
# Compose BOM controls all compose versions
# --------------------------------------------------
activityCompose = "1.10.0"
composeBom = "2025.01.01"

# --------------------------------------------------
# Navigation
# --------------------------------------------------
navigation = "2.8.5"

# --------------------------------------------------
# Hilt
# --------------------------------------------------
hilt = "2.54"
hiltNavigation = "1.2.0"

# --------------------------------------------------
# Retrofit
# --------------------------------------------------
retrofit = "2.11.0"
gsonConverter = "2.11.0"

# --------------------------------------------------
# KSP
# --------------------------------------------------
ksp = "2.1.0-1.0.29"

# --------------------------------------------------
# javax.inject
# --------------------------------------------------
javaxInject = "1"

# --------------------------------------------------
# Material3 Android (kept because you already used it)
# --------------------------------------------------
material3Android = "1.4.0"



[libraries]

# --------------------------------------------------
# Android Core
# --------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }


# --------------------------------------------------
# Testing
# --------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }


# --------------------------------------------------
# Lifecycle
# --------------------------------------------------
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModelCompose" }


# --------------------------------------------------
# Compose
# --------------------------------------------------

# Activity integration for Compose (setContent{})
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM (manages all Compose library versions)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Core Compose UI
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }

# Layouts, LazyColumn, clickable, etc
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Material3 components
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Compose Preview support
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Compose tooling for debug
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# Icons (needed for ArrowBack etc)
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }


# --------------------------------------------------
# Navigation
# --------------------------------------------------
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }


# --------------------------------------------------
# Hilt
# --------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }


# --------------------------------------------------
# Retrofit
# --------------------------------------------------
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "gsonConverter" }


# --------------------------------------------------
# javax.inject
# --------------------------------------------------
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }


# --------------------------------------------------
# Material3 Android (kept because it exists in your project)
# --------------------------------------------------
androidx-compose-material3-android = { group = "androidx.compose.material3", name = "material3-android", version.ref = "material3Android" }



[plugins]

# --------------------------------------------------
# Android plugins
# --------------------------------------------------
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# --------------------------------------------------
# Kotlin plugins
# --------------------------------------------------
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }

# --------------------------------------------------
# Hilt
# --------------------------------------------------
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# --------------------------------------------------
# KSP
# --------------------------------------------------
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }